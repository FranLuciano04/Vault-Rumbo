# CI de Rumbo (DEC-0015 §8 y §9, T-018): cada PR corre solo los jobs de las carpetas que toca.
#
# - Los PR siempre disparan el workflow y el job `cambios` decide qué corre; los jobs omitidos
#   cuentan como exitosos, así los checks no quedan colgados.
# - PROTECCIÓN DE `main`: exigir como único check «CI ok» (job `ci-ok`). Si `cambios` falla, los
#   demás jobs quedan omitidos y pasarían por verdes; `ci-ok` lo detecta y falla.
# - Los push a `main` solo disparan el workflow si tocan `src/` o `.github/`, de modo que los push
#   directos de los claims de tickets (`06-Desarrollo/Tickets/`) no gastan minutos.
# - Un cambio en este archivo corre los tres jobs, para que su propio PR se verifique.
# - El job `e2e` (T-025) corre cuando cambia cualquier cosa bajo `src/`: levanta el Compose de e2e.
# - Seguridad (T-019): `secretos` (gitleaks) corre en todo PR, sin filtro, porque revisa el vault
#   también. `sast` (Semgrep) corre con los cambios de `src/`. pip-audit y bandit van en `backend`, y
#   pnpm audit en `web`. Falla ante un secreto o una vulnerabilidad de severidad alta. Falsos
#   positivos: `.gitleaks.toml` (gitleaks) o `# nosemgrep` / `# nosec` con su motivo en el código.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cambios:
    name: Qué carpetas cambiaron
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      web: ${{ steps.filtro.outputs.web }}
      mobile: ${{ steps.filtro.outputs.mobile }}
      src: ${{ steps.filtro.outputs.src }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filtro
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Base de comparación: en PR, el primer padre del merge commit (punta de `main`);
          # en push, el SHA anterior de `main`, que se trae aparte porque depth 2 no lo garantiza.
          base=
          if [[ "$EVENTO" == pull_request ]]; then
            base=HEAD^1
          elif [[ ! "$ANTES" =~ ^0*$ ]] && git fetch --depth=1 origin "$ANTES"; then
            base="$ANTES"
          fi

          if [[ -z "$base" ]]; then
            # Push inicial, force-push o base no disponible: se corre todo.
            archivos=.github/workflows/ci.yml  # coincide con la regla de raíz
          else
            archivos="$(git diff --name-only "$base" HEAD)"
          fi
          echo "Archivos cambiados:"; echo "$archivos"

          # Se declara aparte el cambio de este workflow o del lockfile/config raíz del workspace.
          raiz='^(\.github/workflows/ci\.yml|src/(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|eslint\.config\.base\.js))$'
          hay() { grep -Eq "$1" <<<"$archivos" && echo true || echo false; }

          # Mobile todavía no consume @rumbo/shared: sumar `^src/packages/shared/` cuando lo haga.
          {
            echo "backend=$(hay "$raiz|^src/backend/")"
            echo "web=$(hay "$raiz|^src/apps/web/|^src/packages/shared/")"
            echo "mobile=$(hay "$raiz|^src/apps/mobile/")"
            echo "src=$(hay "$raiz|^src/")"
          } | tee -a "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/backend
    env:
      # Base descartable del servicio de abajo: vive solo durante el job y no es accesible desde afuera.
      CI_DB_PASSWORD: rumbo-ci-descartable
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rumbo
          POSTGRES_PASSWORD: rumbo-ci-descartable
          POSTGRES_DB: rumbo_test # el nombre debe terminar en «_test» (tests/conftest.py)
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rumbo -d rumbo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: src/backend/uv.lock
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tipos (mypy)
        run: uv run mypy rumbo
      - name: Migraciones (alembic upgrade head)
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://rumbo:${{ env.CI_DB_PASSWORD }}@localhost:5432/rumbo_test
      - name: Tests con cobertura (total >= 70 %, negocio >= 80 %)
        run: |
          uv run pytest --cov=rumbo --cov-report=term-missing
          uv run coverage report --include='rumbo/negocio/*' --fail-under=80
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://rumbo:${{ env.CI_DB_PASSWORD }}@localhost:5432/rumbo_test
      # pip-audit no filtra por severidad: falla ante cualquier vulnerabilidad conocida del lock.
      # Un falso positivo se silencia con `--ignore-vuln <ID>` aquí, con un comentario que diga por qué.
      - name: Auditoría de dependencias (pip-audit)
        run: uv run pip-audit --progress-spinner=off
      - name: Análisis estático (bandit, severidad alta)
        # Un falso positivo se silencia con `# nosec <ID>` en la línea, con el motivo al lado.
        run: uv run bandit -r rumbo --severity-level high

  web:
    name: Web
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @rumbo/shared --filter @rumbo/web lint
      - name: Tipos
        run: pnpm --filter @rumbo/shared --filter @rumbo/web typecheck
      - name: Tests de shared
        run: pnpm --filter @rumbo/shared test
      - name: Tests de web con cobertura (>= 70 %)
        run: >-
          pnpm --filter @rumbo/web test:cobertura
          --coverage.thresholds.statements=70 --coverage.thresholds.branches=70
          --coverage.thresholds.functions=70 --coverage.thresholds.lines=70
      # Audita el lockfile del workspace entero (web y mobile). Falla con severidad alta o crítica.
      - name: Auditoría de dependencias (pnpm audit)
        run: pnpm audit --audit-level=high

  mobile:
    name: Mobile
    needs: cambios
    if: needs.cambios.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter @rumbo/mobile lint
      - name: Tipos
        run: pnpm --filter @rumbo/mobile typecheck
      - name: Tests con cobertura (>= 70 %)
        run: >-
          pnpm --filter @rumbo/mobile test:cobertura
          --coverageThreshold='{"global":{"statements":70,"branches":70,"functions":70,"lines":70}}'

  e2e:
    name: E2e web
    needs: cambios
    if: needs.cambios.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src
    env:
      # Sin src/.env en el runner, el setup de e2e usa esta base descartable (apps/web/e2e/compose.ts).
      RUMBO_DB_USER: rumbo
      RUMBO_DB_PASSWORD: rumbo-e2e-descartable
      # Deja el stack arriba al terminar los tests para poder leer los logs si fallan; se baja al final.
      E2E_MANTENER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Instalar Chromium de Playwright
        run: pnpm --filter @rumbo/web exec playwright install --with-deps chromium
      - name: E2e (Compose + datos-iniciales + Playwright)
        run: pnpm --filter @rumbo/web e2e
      - name: Informe de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/apps/web/playwright-report/
            src/apps/web/test-results/
          retention-days: 7
      - name: Logs del Compose
        if: failure()
        run: docker compose -p rumbo-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color --tail=200
      - name: Bajar el Compose de e2e
        if: always()
        run: docker compose -p rumbo-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans

  # Sin filtro de carpetas: un secreto puede estar en el vault (`06-Desarrollo/`, `05-Diseño/`, …).
  # Revisa todos los commits del PR (el checkout de un PR es el merge, así que incluye todo `main`).
  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks recorre el historial completo, no solo el último commit
      - name: Instalar gitleaks (versión y sha256 fijos)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Escanear el repo completo, vault incluido
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  # Semgrep corre en la imagen con la versión fijada (no se instala en el runner). Solo falla con
  # severidad ERROR (alta). Un falso positivo se silencia con `# nosemgrep: <regla>` y su motivo.
  sast:
    name: Análisis estático (Semgrep)
    needs: cambios
    if: needs.cambios.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (reglas Python, TypeScript y OWASP Top Ten)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src semgrep/semgrep:1.182.0
          semgrep scan --config p/python --config p/typescript --config p/owasp-top-ten
          --severity ERROR --error --metrics=off src

  # Único check a exigir en la protección de `main`. Falla si algún job falló o se canceló,
  # incluido `cambios` (sin él, los demás quedarían omitidos y parecerían aprobados).
  ci-ok:
    name: CI ok
    needs: [cambios, backend, web, mobile, e2e, secretos, sast]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          if [[ " $RESULTADOS " =~ " failure " || " $RESULTADOS " =~ " cancelled " ]]; then
            echo "Algún job falló o se canceló."
            exit 1
          fi
