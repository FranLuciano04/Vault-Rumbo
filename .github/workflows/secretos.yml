# Escaneo de secretos con gitleaks (T-019, DEC-0001). Un solo job, en dos disparadores:
#
# - `workflow_call`: `ci.yml` lo llama en cada PR, así `ci-ok` lo exige como los demás jobs.
# - `push` a `main` sin filtro de carpetas: el vault se pushea directo a `main` (claims de
#   tickets, notas) y `ci.yml` filtra por `src/**` y `.github/**`, así que sin esto esos cambios
#   no se revisarían.
#
# Se escanea HEAD y no todas las ramas (`--log-opts=HEAD`): gitleaks, sin esa opción, recorre
# `--all`, y un secreto en una rama ajena rompería todos los PR. En un PR, HEAD es el merge ref
# (`main` más la rama del PR), así que cubre todo lo que se va a integrar. En un push a `main`,
# HEAD es `main`.
name: Secretos

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks necesita el historial completo para recorrer los commits
      - name: Instalar gitleaks (versión y sha256 fijos)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Escanear HEAD, vault incluido
        run: gitleaks git --config .gitleaks.toml --log-opts="HEAD" --redact --no-banner --verbose .
