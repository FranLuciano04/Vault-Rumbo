# Override para levantar el Compose contra el proyecto REAL de Firebase (sin emulador). DEC-0016.
#   docker compose -f src/docker-compose.yml -f src/docker-compose.firebase.yml up -d --build
# Requiere en src/.env (fuera de Git): RUMBO_FIREBASE_CREDENCIALES (ruta en el host al JSON de la
# cuenta de servicio, fuera del repo), FIREBASE_PROJECT_ID real y las VITE_FIREBASE_* reales.
# El JSON se monta en solo lectura; nunca entra en una imagen ni en Git. Ver src/infra/firebase.md.
# No combinar con docker-compose.e2e.yml (el emulador y la credencial real son excluyentes).

services:
  api:
    environment: &credencial-firebase
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-cuenta-de-servicio.json
    volumes: &montaje-firebase
      - type: bind
        source: ${RUMBO_FIREBASE_CREDENCIALES:?Falta RUMBO_FIREBASE_CREDENCIALES en src/.env (ruta al JSON de la cuenta de servicio de Firebase, ver src/infra/firebase.md)}
        target: /run/secrets/firebase-cuenta-de-servicio.json
        read_only: true

  scheduler:
    environment: *credencial-firebase
    volumes: *montaje-firebase
