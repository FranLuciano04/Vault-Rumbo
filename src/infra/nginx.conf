# nginx de Rumbo: sirve la web compilada y reenvía /api a la API. DEC-0011.
server {
    listen 80;
    server_name _;
    # Los redirects de nginx (p. ej. /api -> /api/) conservan el puerto que pidió el cliente.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Los assets llevan hash en el nombre: se pueden cachear sin riesgo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier ruta del front vuelve a index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
