packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@firebase/util": false
  "@parcel/watcher": true
  msw: true
  protobufjs: false
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@asamuzakjp/dom-selector@10.0.3"
  - "@vitest/coverage-v8@5.0.5"
  - "@vitest/mocker@5.0.5"
  - "@vitest/spy@5.0.5"
  - jsdom@30.1.3
  - vitest@5.0.5
  - "@expo/cli@58.1.13"
  - "@expo/metro-config@58.0.15"
  - "@expo/router-server@58.0.15"
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo-router@58.0.24
  - expo@58.0.16
# Seguridad (T-019): `pnpm audit --audit-level=high` corre en el CI del job `web`.
overrides:
  # GHSA-m9gg-hp2v-232j (alta, con parche): @grpc/grpc-js < 1.13.6 llega a la web por Firebase Firestore.
  "@grpc/grpc-js": "^1.13.6"
audit:
  ignore:
    # GHSA-86w9-cpqp-85rv (alta, sin parche en ninguna versión): node-forge entra por el CLI de Expo,
    # que se usa para build y desarrollo y no forma parte del código de la app. Riesgo aceptado por Nahuel (21/10/26):
    # revisar cuando haya parche o cambie el árbol de dependencias de Expo.
    - GHSA-86w9-cpqp-85rv
    # GHSA-vfj7-8cjw-p6xm (alta, sin parche en ninguna versión): braces entra por Metro y Tailwind, que
    # corren en build y desarrollo. Riesgo aceptado por Nahuel (21/10/26): revisar cuando haya parche.
    - GHSA-vfj7-8cjw-p6xm
